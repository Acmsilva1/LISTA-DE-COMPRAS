<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISTA DE COMPRAS</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --secondary: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header h1 { font-size: 1.2rem; margin: 0; font-weight: 700; color: var(--primary); }

        .header-actions { display: flex; gap: 15px; align-items: center; }

        .module { margin-bottom: 12px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .module-header { background: var(--card); padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .module-title { display: flex; align-items: center; gap: 12px; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        .badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; }

        .module-content { display: none; background: #161e2e; padding: 16px; border-top: 1px solid var(--border); }
        .module-content.open { display: block; }

        .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
        input { background: var(--bg); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; outline: none; font-size: 1rem; }
        .btn-add { background: var(--primary); border: none; color: white; padding: 12px 20px; border-radius: 8px; font-weight: bold; }

        .item-list { list-style: none; padding: 0; margin: 0; }
        .item-row { display: flex; align-items: center; background: var(--card); padding: 12px; border-radius: 8px; margin-bottom: 8px; gap: 12px; }
        .item-row.checked { opacity: 0.5; }
        .item-row.checked .item-name { text-decoration: line-through; color: var(--secondary); }

        .check-container { width: 24px; height: 24px; border: 2px solid var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .check-container.checked::after { content: '✓'; color: var(--primary); font-weight: bold; }

        .item-info { flex: 1; display: flex; flex-direction: column; }
        .item-name { font-weight: 500; }
        .item-qty { font-size: 0.8rem; color: var(--secondary); }

        .actions { display: flex; gap: 8px; }
        .btn-delete { background: none; border: none; color: var(--danger); font-size: 1.2rem; }
        .btn-edit { background: none; border: none; color: var(--warning); font-size: 1.2rem; }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-btn { background: none; border: none; color: var(--secondary); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1>LISTA DE COMPRAS</h1>
        <div class="header-actions">
            <button id="btn-sync-all" class="nav-btn" onclick="syncAllExistingData()" title="Sincronizar com Planilha">☁️</button>
            <button class="nav-btn" onclick="resetChecks()" title="Limpar marcados">🔄</button>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('mod-mantimentos')">
            <div class="module-title">📦 MANTIMENTOS <span class="badge" id="badge-mantimentos">0</span></div>
            <span>▼</span>
        </div>
        <div id="mod-mantimentos" class="module-content">
            <div class="input-group">
                <input type="text" id="name-mantimentos" placeholder="Item..." style="flex: 2">
                <input type="number" id="qty-mantimentos" value="1" style="flex: 1">
                <button class="btn-add" onclick="createItem('mantimentos')">+</button>
            </div>
            <ul class="item-list" id="list-mantimentos"></ul>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('mod-carnes')">
            <div class="module-title">🥩 CARNES <span class="badge" id="badge-carnes">0</span></div>
            <span>▼</span>
        </div>
        <div id="mod-carnes" class="module-content">
            <div class="input-group">
                <input type="text" id="name-carnes" placeholder="Item..." style="flex: 2">
                <input type="number" id="qty-carnes" value="1" style="flex: 1">
                <button class="btn-add" onclick="createItem('carnes')">+</button>
            </div>
            <ul class="item-list" id="list-carnes"></ul>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('mod-higiene')">
            <div class="module-title">🧼 HIGIENE <span class="badge" id="badge-higiene">0</span></div>
            <span>▼</span>
        </div>
        <div id="mod-higiene" class="module-content">
            <div class="input-group">
                <input type="text" id="name-higiene" placeholder="Item..." style="flex: 2">
                <input type="number" id="qty-higiene" value="1" style="flex: 1">
                <button class="btn-add" onclick="createItem('higiene')">+</button>
            </div>
            <ul class="item-list" id="list-higiene"></ul>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('mod-feira')">
            <div class="module-title">🍎 FEIRA <span class="badge" id="badge-feira">0</span></div>
            <span>▼</span>
        </div>
        <div id="mod-feira" class="module-content">
            <div class="input-group">
                <input type="text" id="name-feira" placeholder="Item..." style="flex: 2">
                <input type="number" id="qty-feira" value="1" style="flex: 1">
                <button class="btn-add" onclick="createItem('feira')">+</button>
            </div>
            <ul class="item-list" id="list-feira"></ul>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="closeAllModules()">🏠 Início</button>
        <button class="nav-btn" onclick="resetAllData()">🗑️ Limpar Banco</button>
    </div>

<script>
    const DB_KEY = 'andre_shopping_dark_v1';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz08-qHNRGkh0Kqgl2dlBdcYUGhZNQrGG0wTd9piGQIuO539sr22EV7MAIKdsctJ6rx/exec';
    const CATEGORIES = ['mantimentos', 'carnes', 'higiene', 'feira'];
    
    let db = JSON.parse(localStorage.getItem(DB_KEY)) || { mantimentos: [], carnes: [], higiene: [], feira: [] };
    let editId = null;

    async function syncWithSheets(cat, item) {
        try {
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category: cat, ...item })
            });
        } catch (e) { console.error('Erro GAS:', e); }
    }

    async function syncAllExistingData() {
        const btn = document.getElementById('btn-sync-all');
        if (!confirm("Enviar todos os itens atuais para a planilha?")) return;
        
        btn.innerText = '⌛';
        btn.style.opacity = '0.5';

        for (const cat of CATEGORIES) {
            for (const item of db[cat]) {
                await syncWithSheets(cat, item);
                await new Promise(r => setTimeout(r, 300)); 
            }
        }

        btn.innerText = '✅';
        setTimeout(() => { btn.innerText = '☁️'; btn.style.opacity = '1'; }, 2000);
        alert("Sincronização em massa finalizada!");
    }

    function toggleModule(id) {
        const el = document.getElementById(id);
        const isOpen = el.classList.contains('open');
        document.querySelectorAll('.module-content').forEach(m => m.classList.remove('open'));
        if (!isOpen) el.classList.add('open');
    }

    function closeAllModules() {
        document.querySelectorAll('.module-content').forEach(m => m.classList.remove('open'));
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function createItem(cat) {
        const nInput = document.getElementById(`name-${cat}`);
        const qInput = document.getElementById(`qty-${cat}`);
        const name = nInput.value.trim();
        const qty = parseInt(qInput.value);

        if (!name || isNaN(qty) || qty <= 0) return;

        const newItem = { id: Date.now(), name, qty, checked: false };
        db[cat].push(newItem);
        nInput.value = ''; 
        qInput.value = '1';
        save();
        syncWithSheets(cat, newItem);
    }

    function toggleCheck(cat, id) {
        const item = db[cat].find(i => i.id === id);
        if (item) {
            item.checked = !item.checked;
            save();
            syncWithSheets(cat, item);
        }
    }

    function deleteItem(cat, id) {
        db[cat] = db[cat].filter(i => i.id !== id);
        save();
    }

    function resetAllData() {
        if (confirm("Apagar todos os dados do App?")) {
            db = { mantimentos: [], carnes: [], higiene: [], feira: [] };
            save();
        }
    }

    function resetChecks() {
        if (confirm("Deseja desmarcar todos os itens da lista?")) {
            CATEGORIES.forEach(cat => {
                db[cat] = db[cat].map(item => ({ ...item, checked: false }));
            });
            save();
        }
    }

    function save() {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        render();
    }

    function render() {
        CATEGORIES.forEach(cat => {
            const listElement = document.getElementById(`list-${cat}`);
            const badgeElement = document.getElementById(`badge-${cat}`);
            if(!listElement) return;
            
            listElement.innerHTML = '';
            db[cat].forEach(item => {
                const li = document.createElement('li');
                li.className = `item-row ${item.checked ? 'checked' : ''}`;
                li.innerHTML = `
                    <div class="check-container ${item.checked ? 'checked' : ''}" onclick="toggleCheck('${cat}', ${item.id})"></div>
                    <div class="item-info" onclick="toggleCheck('${cat}', ${item.id})">
                        <span class="item-name">${item.name}</span>
                        <span class="item-qty">Qtd: ${item.qty}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-delete" onclick="deleteItem('${cat}', ${item.id})">🗑️</button>
                    </div>
                `;
                listElement.appendChild(li);
            });
            badgeElement.innerText = db[cat].length;
        });
    }

    render();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW offline'));
        });
    }
</script>
</body>
</html>
