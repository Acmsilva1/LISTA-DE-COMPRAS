<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISTA DE COMPRAS</title>
    
    <!-- PWA Meta -->
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            /* Palette Dark Mode - Foco em contraste e legibilidade */
            --bg: #0f172a;        /* Slate 950 */
            --card: #1e293b;      /* Slate 800 */
            --primary: #3b82f6;   /* Blue 500 */
            --secondary: #94a3b8; /* Slate 400 */
            --danger: #ef4444;    /* Red 500 */
            --success: #22c55e;   /* Green 500 */
            --warning: #f59e0b;   /* Amber 500 */
            --text: #f1f5f9;      /* Slate 100 */
            --border: #334155;    /* Slate 700 */
            --input-bg: #1e293b;
        }

        * { 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
            user-select: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 24px;
            color: var(--text);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .module {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .module-header {
            padding: 18px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .module-header:active { filter: brightness(0.8); }

        .module-content {
            display: none;
            padding: 16px;
        }

        .module-content.open { display: block; }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-item { flex: 2 1 150px; }
        .input-qty { flex: 1 1 70px; }
        
        input {
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text);
            outline: none;
            width: 100%;
        }

        input:focus { border-color: var(--primary); }

        .btn-add {
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            flex: 1 1 100%;
        }

        @media (min-width: 400px) { .btn-add { flex: 0 1 auto; } }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }

        .item-row:last-child { border-bottom: none; }

        .item-info { flex-grow: 1; }
        .item-name { font-weight: 600; font-size: 1.05rem; display: block; }
        .item-qty { font-size: 0.85rem; color: var(--secondary); }

        .actions { display: flex; gap: 8px; }

        .btn-delete, .btn-edit, .btn-save {
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }

        .btn-delete { background-color: var(--danger); }
        .btn-edit { background-color: var(--warning); }
        .btn-save { background-color: var(--primary); }

        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        #installBtn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 12px 28px;
            border-radius: 30px;
            display: none;
            border: none;
            font-weight: 800;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .edit-fields {
            display: flex;
            gap: 6px;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LISTA DE COMPRAS</h1>

    <!-- MÓDULO COMIDA -->
    <div class="module">
        <div class="module-header" onclick="toggleModule('comida')">
            <span>🍎 COMIDA</span>
            <span class="badge" id="badge-comida">0</span>
        </div>
        <div id="comida" class="module-content">
            <div class="form-group">
                <input type="text" id="name-comida" class="input-item" placeholder="Item">
                <input type="number" id="qty-comida" class="input-qty" placeholder="Qtd" min="1" value="1">
                <button class="btn-add" onclick="createItem('comida')">ADICIONAR</button>
            </div>
            <ul id="list-comida" class="item-list"></ul>
        </div>
    </div>

    <!-- MÓDULO HIGIENE -->
    <div class="module">
        <div class="module-header" onclick="toggleModule('higiene')">
            <span>🧼 HIGIENE E LIMPEZA</span>
            <span class="badge" id="badge-higiene">0</span>
        </div>
        <div id="higiene" class="module-content">
            <div class="form-group">
                <input type="text" id="name-higiene" class="input-item" placeholder="Item">
                <input type="number" id="qty-higiene" class="input-qty" placeholder="Qtd" min="1" value="1">
                <button class="btn-add" onclick="createItem('higiene')">ADICIONAR</button>
            </div>
            <ul id="list-higiene" class="item-list"></ul>
        </div>
    </div>
</div>

<button id="installBtn">INSTALAR APP</button>

<script>
    const DB_KEY = 'andre_shopping_dark_v1';
    let db = JSON.parse(localStorage.getItem(DB_KEY)) || { comida: [], higiene: [] };
    let editId = null;

    function toggleModule(id) {
        const el = document.getElementById(id);
        const isOpen = el.classList.contains('open');
        document.querySelectorAll('.module-content').forEach(m => m.classList.remove('open'));
        if (!isOpen) el.classList.add('open');
    }

    function createItem(cat) {
        const n = document.getElementById(`name-${cat}`);
        const q = document.getElementById(`qty-${cat}`);
        const name = n.value.trim();
        const qty = parseInt(q.value);

        if (!name || isNaN(qty) || qty <= 0) return;

        db[cat].push({ id: Date.now(), name, qty });
        n.value = ''; q.value = '1';
        save();
    }

    function deleteItem(cat, id) {
        db[cat] = db[cat].filter(i => i.id !== id);
        save();
    }

    function startEdit(id) {
        editId = id;
        render();
    }

    function saveEdit(cat, id) {
        const newName = document.getElementById(`edit-n-${id}`).value.trim();
        const newQty = parseInt(document.getElementById(`edit-q-${id}`).value);

        if (!newName || isNaN(newQty) || newQty <= 0) return;

        const item = db[cat].find(i => i.id === id);
        if (item) {
            item.name = newName;
            item.qty = newQty;
        }
        editId = null;
        save();
    }

    function save() {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        render();
    }

    function render() {
        ['comida', 'higiene'].forEach(cat => {
            const list = document.getElementById(`list-${cat}`);
            const badge = document.getElementById(`badge-${cat}`);
            list.innerHTML = '';
            
            db[cat].forEach(item => {
                const li = document.createElement('li');
                li.className = 'item-row';
                
                if (editId === item.id) {
                    li.innerHTML = `
                        <div class="edit-fields">
                            <input type="text" id="edit-n-${item.id}" value="${item.name}" style="flex:2">
                            <input type="number" id="edit-q-${item.id}" value="${item.qty}" style="flex:1">
                        </div>
                        <button class="btn-save" onclick="saveEdit('${cat}', ${item.id})">OK</button>
                    `;
                } else {
                    li.innerHTML = `
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            <span class="item-qty">Qtd: ${item.qty}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="startEdit(${item.id})">✏️</button>
                            <button class="btn-delete" onclick="deleteItem('${cat}', ${item.id})">🗑️</button>
                        </div>
                    `;
                }
                list.appendChild(li);
            });
            badge.innerText = db[cat].length;
        });
    }

    // Registro do Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW: Ativo'))
            .catch(err => console.log('SW: Erro', err));
        });
    }

    // Instalação PWA
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBtn').style.display = 'block';
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('installBtn').style.display = 'none';
            deferredPrompt = null;
        }
    });

    render();
</script>
</body>
</html>
