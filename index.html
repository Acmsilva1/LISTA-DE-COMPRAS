<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISTA DE COMPRAS</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --secondary: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --text: #f1f5f9;
            --border: #334155;
        }

        * { 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
            line-height: 1.5;
            user-select: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header-area {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 24px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 0 45px;
            color: var(--text);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-reset-all, .btn-reset-checks {
            position: absolute;
            background: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset-all { right: 0; border: 2px solid var(--danger); color: var(--danger); }
        .btn-reset-checks { left: 0; border: 2px solid var(--success); color: var(--success); }

        .btn-reset-all:active { background: var(--danger); color: white; transform: scale(0.9); }
        .btn-reset-checks:active { background: var(--success); color: white; transform: scale(0.9); }

        .btn-sync {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            background: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-sync:active {
            background: var(--primary);
            color: white;
            transform: translateX(-50%) scale(0.9);
        }

        .module {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .module-header {
            padding: 18px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .module-header:active { filter: brightness(0.8); }

        .module-content {
            display: none;
            padding: 16px;
        }

        .module-content.open { display: block; }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-item { flex: 2 1 150px; }
        .input-qty { flex: 1 1 70px; }
        
        input[type="text"], input[type="number"] {
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text);
            outline: none;
            width: 100%;
        }

        input:focus { border-color: var(--primary); }

        .btn-add {
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            flex: 1 1 100%;
        }

        @media (min-width: 400px) { .btn-add { flex: 0 1 auto; } }

        .item-list { list-style: none; padding: 0; margin: 0; }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            transition: opacity 0.3s;
        }

        .item-row.checked { opacity: 0.5; }
        .item-row:last-child { border-bottom: none; }

        .check-container {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 28px;
            height: 28px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 6px;
            position: relative;
        }

        .check-container.checked { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
        .check-container.checked::after { content: '✓'; color: var(--success); font-size: 20px; font-weight: 900; }

        .item-info { flex-grow: 1; margin-left: 8px; cursor: pointer; }
        .item-name { font-weight: 600; font-size: 1.05rem; display: block; }
        .item-row.checked .item-name { text-decoration: line-through; color: var(--secondary); }
        .item-qty { font-size: 0.85rem; color: var(--secondary); }

        .actions { display: flex; gap: 8px; }

        .btn-delete, .btn-edit, .btn-save {
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }

        .btn-delete { background-color: var(--danger); }
        .btn-edit { background-color: var(--warning); }
        .btn-save { background-color: var(--primary); }

        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        #homeBtn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            z-index: 1001;
        }

        .edit-fields { display: flex; gap: 6px; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <button class="btn-reset-checks" onclick="resetChecks()" title="Resetar Marcações">✓</button>
        <h1>LISTA DE COMPRAS</h1>
        <button class="btn-sync" onclick="syncFromCloud()" title="Sincronizar com a nuvem">⟳</button>
        <button class="btn-reset-all" onclick="resetAllData()" title="Limpar Tudo">X</button>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('mantimentos')">
            <span>📦 MANTIMENTOS</span>
            <span class="badge" id="badge-mantimentos">0</span>
        </div>
        <div id="mantimentos" class="module-content">
            <div class="form-group">
                <input type="text" id="name-mantimentos" class="input-item" placeholder="Item">
                <input type="number" id="qty-mantimentos" class="input-qty" placeholder="Qtd" min="1" value="1">
                <button class="btn-add" onclick="createItem('mantimentos')">ADICIONAR</button>
            </div>
            <ul id="list-mantimentos" class="item-list"></ul>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('carnes')">
            <span>🥩 CARNES E DERIVADOS</span>
            <span class="badge" id="badge-carnes">0</span>
        </div>
        <div id="carnes" class="module-content">
            <div class="form-group">
                <input type="text" id="name-carnes" class="input-item" placeholder="Item">
                <input type="number" id="qty-carnes" class="input-qty" placeholder="Qtd" min="1" value="1">
                <button class="btn-add" onclick="createItem('carnes')">ADICIONAR</button>
            </div>
            <ul id="list-carnes" class="item-list"></ul>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('higiene')">
            <span>🧼 HIGIENE E LIMPEZA</span>
            <span class="badge" id="badge-higiene">0</span>
        </div>
        <div id="higiene" class="module-content">
            <div class="form-group">
                <input type="text" id="name-higiene" class="input-item" placeholder="Item">
                <input type="number" id="qty-higiene" class="input-qty" placeholder="Qtd" min="1" value="1">
                <button class="btn-add" onclick="createItem('higiene')">ADICIONAR</button>
            </div>
            <ul id="list-higiene" class="item-list"></ul>
        </div>
    </div>

    <div class="module">
        <div class="module-header" onclick="toggleModule('feira')">
            <span>🥦 FEIRA</span>
            <span class="badge" id="badge-feira">0</span>
        </div>
        <div id="feira" class="module-content">
            <div class="form-group">
                <input type="text" id="name-feira" class="input-item" placeholder="Item">
                <input type="number" id="qty-feira" class="input-qty" placeholder="Qtd" min="1" value="1">
                <button class="btn-add" onclick="createItem('feira')">ADICIONAR</button>
            </div>
            <ul id="list-feira" class="item-list"></ul>
        </div>
    </div>
</div>

<button id="homeBtn" onclick="closeAllModules()">🏠</button>

<script>
    const API_URL = 'https://script.google.com/macros/s/SEU_WEB_APP_URL/exec'; // TROQUE PELO SEU LINK DO GAS
    const CATEGORIES = ['mantimentos', 'carnes', 'higiene', 'feira'];
    
    let db = {
        mantimentos: [],
        carnes: [],
        higiene: [],
        feira: []
    };
    
    let editId = null;

    async function apiGet(params) {
        const url = API_URL + '?' + new URLSearchParams(params).toString();
        const res = await fetch(url);
        if (!res.ok) throw new Error('Erro na comunicação com o servidor (GET)');
        return res.json();
    }

    async function apiPost(body) {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Erro na comunicação com o servidor (POST)');
        return res.json();
    }

    function toggleModule(id) {
        const el = document.getElementById(id);
        const isOpen = el.classList.contains('open');
        document.querySelectorAll('.module-content').forEach(m => m.classList.remove('open'));
        if (!isOpen) el.classList.add('open');
    }

    function closeAllModules() {
        document.querySelectorAll('.module-content').forEach(m => m.classList.remove('open'));
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function resetAllData() {
        if (confirm("Deseja apagar TODOS os itens e módulos? Operação sem CTRL+Z.")) {
            try {
                await apiPost({ action: 'resetAll' });
                await loadFromCloud();
                closeAllModules();
            } catch (e) {
                alert('Erro ao limpar dados na nuvem.');
            }
        }
    }

    async function resetChecks() {
        if (confirm("Deseja desmarcar todos os itens comprados para uma nova rodada?")) {
            try {
                await apiPost({ action: 'resetChecks' });
                await loadFromCloud();
            } catch (e) {
                alert('Erro ao resetar marcações na nuvem.');
            }
        }
    }

    async function toggleCheck(cat, id) {
        const item = db[cat].find(i => i.id === id);
        if (!item) return;
        try {
            await apiPost({ action: 'toggle', row: id });
            await loadFromCloud();
        } catch (e) {
            alert('Erro ao atualizar status na nuvem.');
        }
    }

    async function createItem(cat) {
        const nInput = document.getElementById(`name-${cat}`);
        const qInput = document.getElementById(`qty-${cat}`);
        const name = nInput.value.trim();
        const qty = parseInt(qInput.value, 10);

        if (!name || isNaN(qty) || qty <= 0) return;

        try {
            await apiPost({
                action: 'create',
                category: cat,
                name: name,
                qty: qty
            });

            nInput.value = '';
            qInput.value = '1';

            await loadFromCloud();
        } catch (e) {
            alert('Erro ao criar item na nuvem.');
        }
    }

    async function deleteItem(cat, id) {
        try {
            await apiPost({ action: 'delete', row: id });
            await loadFromCloud();
        } catch (e) {
            alert('Erro ao excluir item na nuvem.');
        }
    }

    function startEdit(id) {
        editId = id;
        render();
    }

    async function saveEdit(cat, id) {
        const newName = document.getElementById(`edit-n-${id}`).value.trim();
        const newQty = parseInt(document.getElementById(`edit-q-${id}`).value, 10);

        if (!newName || isNaN(newQty) || newQty <= 0) return;

        try {
            await apiPost({
                action: 'update',
                row: id,
                name: newName,
                qty: newQty
            });
            editId = null;
            await loadFromCloud();
        } catch (e) {
            alert('Erro ao salvar edição na nuvem.');
        }
    }

    function mapCloudToLocal(items) {
        db = {
            mantimentos: [],
            carnes: [],
            higiene: [],
            feira: []
        };

        items.forEach(row => {
            const cat = row.category;
            if (!CATEGORIES.includes(cat)) return;

            const checked = (row.status || '').toLowerCase() === 'comprado';

            db[cat].push({
                id: row.row,
                name: row.item,
                qty: row.qty,
                checked: checked
            });
        });

        render();
    }

    async function loadFromCloud() {
        try {
            const data = await apiGet({ action: 'list' });
            if (data && data.success) {
                mapCloudToLocal(data.items || []);
            } else {
                alert('Falha ao carregar dados da nuvem.');
            }
        } catch (e) {
            alert('Erro ao carregar dados da nuvem.');
        }
    }

    async function syncFromCloud() {
        try {
            await loadFromCloud();
        } catch (e) {
            alert('Erro ao sincronizar com a nuvem.');
        }
    }

    function render() {
        CATEGORIES.forEach(cat => {
            const listElement = document.getElementById(`list-${cat}`);
            const badgeElement = document.getElementById(`badge-${cat}`);
            if(!listElement || !badgeElement) return;
            
            listElement.innerHTML = '';
            
            db[cat].forEach(item => {
                const li = document.createElement('li');
                li.className = `item-row ${item.checked ? 'checked' : ''}`;
                
                if (editId === item.id) {
                    li.innerHTML = `
                        <div class="edit-fields">
                            <input type="text" id="edit-n-${item.id}" value="${item.name}" style="flex:2">
                            <input type="number" id="edit-q-${item.id}" value="${item.qty}" style="flex:1">
                        </div>
                        <button class="btn-save" onclick="saveEdit('${cat}', ${item.id})">OK</button>
                    `;
                } else {
                    li.innerHTML = `
                        <div class="check-container ${item.checked ? 'checked' : ''}" onclick="toggleCheck('${cat}', ${item.id})"></div>
                        <div class="item-info" onclick="toggleCheck('${cat}', ${item.id})">
                            <span class="item-name">${item.name}</span>
                            <span class="item-qty">Qtd: ${item.qty}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="startEdit(${item.id})">✏️</button>
                            <button class="btn-delete" onclick="deleteItem('${cat}', ${item.id})">🗑️</button>
                        </div>
                    `;
                }
                listElement.appendChild(li);
            });
            badgeElement.innerText = db[cat].length;
        });
    }

    // Carrega da nuvem ao abrir a página
    loadFromCloud();

    // Registro do Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW ativo:', reg.scope))
                .catch(err => console.error('Erro no SW:', err));
        });
    }
</script>
</body>
</html>
