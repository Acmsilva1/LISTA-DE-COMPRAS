<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LISTA DE COMPRAS PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --danger: #ef4444; --success: #22c55e; --text: #f1f5f9; --border: #334155; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .module { background: var(--card); border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border); overflow: hidden; }
        .module-header { padding: 15px; display: flex; justify-content: space-between; cursor: pointer; font-weight: bold; }
        .module-content { display: none; padding: 15px; background: #161e2e; border-top: 1px solid var(--border); }
        .module-content.open { display: block; }
        .item-row { display: flex; align-items: center; background: var(--bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; gap: 10px; }
        .item-row.checked { opacity: 0.5; text-decoration: line-through; }
        .check { width: 24px; height: 24px; border: 2px solid var(--primary); border-radius: 5px; display: flex; align-items: center; justify-content: center; }
        .check.active::after { content: '✓'; color: var(--primary); font-weight: bold; }
        input { background: var(--card); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 5px; width: 100%; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 15px; }
        button { cursor: pointer; border: none; border-radius: 5px; }
        .btn-sync { background: var(--primary); color: white; padding: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; font-size: 1rem;">LISTA DO ANDRÉ</h2>
    <button class="btn-sync" onclick="syncAll()">☁️ Sincronizar</button>
</div>

<div id="app"></div>

<div class="nav-bar">
    <button onclick="location.reload()" style="background:none; color:white">🔃 Atualizar App</button>
    <button onclick="resetChecks()" style="background:none; color:var(--danger)">🔄 Limpar Checks</button>
</div>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz08-qHNRGkh0Kqgl2dlBdcYUGhZNQrGG0wTd9piGQIuO539sr22EV7MAIKdsctJ6rx/exec'; // <--- COLOQUE SUA URL DO GOOGLE AQUI
    const DB_KEY = 'andre_db_v3';
    const CATEGORIES = ['mantimentos', 'carnes', 'higiene', 'feira'];
    const ICONS = { mantimentos: '📦', carnes: '🥩', higiene: '🧼', feira: '🍎' };

    let db = JSON.parse(localStorage.getItem(DB_KEY)) || { mantimentos: [], carnes: [], higiene: [], feira: [] };
    let openModules = JSON.parse(localStorage.getItem('open_tabs')) || {};
    let editId = null;

    function save() {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        localStorage.setItem('open_tabs', JSON.stringify(openModules));
        render();
    }

    async function callGAS(payload) {
        try { await fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) }); } catch(e){}
    }

    function addItem(cat) {
        const name = document.getElementById(`in-${cat}`).value;
        if(!name) return;
        const item = { id: Date.now(), name, qty: 1, checked: false };
        db[cat].push(item);
        document.getElementById(`in-${cat}`).value = '';
        save();
        callGAS({ category: cat, ...item });
    }

    function toggleCheck(cat, id) {
        const item = db[cat].find(i => i.id === id);
        item.checked = !item.checked;
        save();
        callGAS({ category: cat, ...item });
    }

    function deleteItem(cat, id) {
        const item = db[cat].find(i => i.id === id);
        db[cat] = db[cat].filter(i => i.id !== id);
        save();
        callGAS({ action: 'DELETE', category: cat, name: item.name });
    }

    async function syncAll() {
        const op = confirm("OK: Enviar para Nuvem\nCANCELAR: Baixar da Nuvem");
        if(op) {
            alert("Enviando... aguarde.");
            for (const cat of CATEGORIES) {
                for (const item of db[cat]) {
                    await callGAS({ category: cat, ...item });
                    await new Promise(r => setTimeout(r, 300));
                }
            }
            alert("Enviado!");
        } else {
            const res = await fetch(GAS_URL);
            const data = await res.json();
            if(data.length > 0) {
                const newDb = { mantimentos: [], carnes: [], higiene: [], feira: [] };
                data.forEach(i => { if(newDb[i.category]) newDb[i.category].push({id: Math.random(), ...i}); });
                db = newDb;
                save();
            }
        }
    }

    function render() {
        const container = document.getElementById('app');
        container.innerHTML = '';
        CATEGORIES.forEach(cat => {
            const isOpen = openModules[cat] || false;
            const mod = document.createElement('div');
            mod.className = 'module';
            mod.innerHTML = `
                <div class="module-header" onclick="openModules['${cat}']=!openModules['${cat}']; save();">
                    <span>${ICONS[cat]} ${cat.toUpperCase()} (${db[cat].length})</span>
                    <span>${isOpen ? '▲' : '▼'}</span>
                </div>
                <div class="module-content ${isOpen ? 'open' : ''}">
                    <div style="display:flex; gap:5px; margin-bottom:10px">
                        <input id="in-${cat}" placeholder="Novo...">
                        <button onclick="addItem('${cat}')" style="background:var(--primary); color:white; padding:10px">+</button>
                    </div>
                    <div id="list-${cat}"></div>
                </div>
            `;
            container.appendChild(mod);

            const list = document.getElementById(`list-${cat}`);
            db[cat].forEach(item => {
                const row = document.createElement('div');
                row.className = `item-row ${item.checked ? 'checked' : ''}`;
                row.innerHTML = `
                    <div class="check ${item.checked ? 'active' : ''}" onclick="toggleCheck('${cat}', ${item.id})"></div>
                    <div style="flex:1" onclick="toggleCheck('${cat}', ${item.id})">${item.name}</div>
                    <button onclick="deleteItem('${cat}', ${item.id})" style="background:none; font-size:1.2rem">🗑️</button>
                `;
                list.appendChild(row);
            });
        });
    }

    function resetChecks() {
        if(confirm("Limpar todos os checks?")) {
            CATEGORIES.forEach(cat => db[cat].forEach(i => { i.checked = false; callGAS({category: cat, ...i}); }));
            save();
        }
    }

    render();
    window.addEventListener('load', () => {
        if(CATEGORIES.every(c => db[c].length === 0)) syncAll();
    });
</script>
</body>
</html>
